section = "Chapter 10"
summary = "The ex-priest describes to the kid how the Glanton gang met the judge in the desert. The judge appeared alone on a rock like an apparition. The ex-priest initially felt cursed by this meeting but later thought otherwise after the judge's makeshift gunpowder helped them defeat Indians. Now he questions that relief. The chapter establishes the judge's mythic status through his vast knowledge (languages, geology, botany), physical dominance, and unsettling presence."
takeaway = "The judge is portrayed as accumulated — possessing too much skill, knowledge, and presence to be merely human. The ex-priest's shifting interpretation of him as curse/blessing/uncertainty creates the reader's own unease about his true nature."
