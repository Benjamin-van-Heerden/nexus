[[sessions]]
date = "2026-04-06"
description = "Chapter 10"
summary = "The ex-priest describes to the kid how the Glanton gang met the judge in the desert. The judge appeared alone on a rock like an apparition. The ex-priest initially felt cursed by this meeting but later thought otherwise after the judge's makeshift gunpowder helped them defeat Indians. Now he questions that relief. The chapter establishes the judge's mythic status through his vast knowledge (languages, geology, botany), physical dominance, and unsettling presence."
takeaway = "The judge is portrayed as accumulated — possessing too much skill, knowledge, and presence to be merely human. The ex-priest's shifting interpretation of him as curse/blessing/uncertainty creates the reader's own unease about his true nature."

[[sessions]]
date = "2026-04-06"
description = "Chapter 11"
summary = "The gang travels through mountains; a Delaware is killed by a bear. At camp, the judge tells a parable about a harness maker who dressed as an Indian beggar, killed a traveler who showed him kindness, and buried him in the woods. The judge reveals the harness maker's son became a killer and the traveler left a pregnant wife. The gang argues about details rather than engage with the meaning."
takeaway = "The harness maker parable is a theological provocation, not a moral lesson. The judge poses questions about evil and inheritance to an audience incapable of answering. His capitalization shifts (Judge/judge) suggest he operates as both man and dark mirror of divine authority — an inhuman presence with knowledge of the true God."

[[sessions]]
date = "2026-04-08"
description = "Chapter 12"
summary = "The Glanton Gang massacres innocent people believing they're hunting Gomez, only to learn it was the wrong group entirely. The judge murders and scalps a child. They ride into Chihuahua hailed as heroes."
takeaway = "The world of Blood Meridian is extraordinarily violent and less civilized than today—morality is suggestive and good does not always win over evil."

[[sessions]]
date = "2026-04-23"
description = "Chapter 13"
summary = "Glanton Gang arrives in Chihuahua City as heroes with 120 scalps, receives feast and gold from Governor Trias, then leaves destruction in their wake. They massacre peaceful Tiguas and Mexican villagers indiscriminately, escalating from hired scalp hunters to wanton killers. The chapter shows their corruption spreading through every town they touch, culminating in soldiers escorting them out as word spreads of their atrocities."
takeaway = "The violence is constitutional, not situational — the gang carries corruption within them. The judge's charisma and adaptability mask (or perhaps express) complete amorality. Societies enable their own destroyers when they hire violence to solve problems, celebrating heroes who become butchers. The indiscriminate massacres reveal the gang's true nature beyond any contractual justification."
