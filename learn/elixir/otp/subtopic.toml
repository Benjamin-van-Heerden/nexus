name = "OTP Deep Dive"
current_phase = "otp-foundations"
phases = [
    { name = "otp-foundations", status = "in_progress" },
    { name = "abstractions-and-supervision", status = "todo" },
    { name = "advanced-patterns", status = "todo" },
    { name = "capstone", status = "todo" },
]

[practical]
description = """
Each phase has a mix project at practical/. Create exercise modules in
practical/lib/ and corresponding tests in practical/test/.

Naming: lib/<slug>.ex and test/<slug>_test.exs, where slug describes
the exercise (e.g. lib/genserver_basics.ex, test/genserver_basics_test.exs).

Structure: modules with stub functions that raise \"implement me\", with
@doc explaining what to implement. Tests use ExUnit assertions.
The user runs `cd practical && mix test` to check their work.

Example:
  # lib/counter.ex
  defmodule Counter do
    @doc \"Implement a simple counter using Agent\"
    use Agent

    def start_link(initial \\\\ 0), do: raise(\"implement me\")
    def get(pid), do: raise(\"implement me\")
    def increment(pid), do: raise(\"implement me\")
  end

  # test/counter_test.exs
  defmodule CounterTest do
    use ExUnit.Case

    test \"counter starts with initial value\" do
      {:ok, pid} = Counter.start_link(0)
      assert Counter.get(pid) == 0
    end

    test \"increment increases count\" do
      {:ok, pid} = Counter.start_link(0)
      Counter.increment(pid)
      assert Counter.get(pid) == 1
    end
  end
"""
setup_commands = [
    "mix new practical --app practical_$(echo ${PHASE} | tr '-' '_')",
    "rm practical/README.md",
    "rm practical/.gitignore"
]

[theoretical]
description = """
Create a markdown file in the phase's theoretical/ directory named
YYYY-MM-DD-<slug>.md (e.g. 2026-04-01-genserver.md).

Select relevant material from the goal's reference document and compose a
focused reading assignment. Summarize key concepts, draw parallels with
other concurrency models the user knows (Python asyncio, Rust async),
and ask the user to explain them back in their own words. Include code
snippets and iex session examples where helpful.
"""
setup_commands = []

[quiz]
description = """
Create TWO files for each quiz:

1. Quiz file: quiz/YYYY-MM-DD-<slug>.md (e.g. 2026-04-01-supervision-quiz.md)
   - Compose 3-5 questions based on recent goals and tasks. Mix:
     - Multiple choice (conceptual understanding)
     - Code prediction (what happens when this process crashes?)
     - Short implementation (write a GenServer callback)
     - Supervision reasoning (draw the supervision tree, identify restart strategy)
   - Include answer placeholders that the user fills in.
   - Do NOT include answers in this file.

2. Answer key: quiz/answers/YYYY-MM-DD-<slug>.md
   - Contains the answers and explanations for the quiz.
   - Kept separate so the user cannot accidentally see them while working.

Register the task with --file pointing to the quiz file (not the answer key).
"""
setup_commands = ["mkdir -p quiz/answers"]
