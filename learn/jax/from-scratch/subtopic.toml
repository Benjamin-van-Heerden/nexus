[practical]
description = "Create exercises as standalone .py files in the practical/examples/ directory,\nnamed by date (YYYY-MM-DD.py). If multiple exercises in one day, use\nYYYY-MM-DD_2.py etc.\n\nEach file should be runnable with `uv run python practical/examples/YYYY-MM-DD.py`\nfrom the phase directory. Files should include assertions or test functions that\nverify correctness — the user runs the file and sees whether their implementation\npasses.\n\nStructure: stub functions with docstrings explaining what to implement, a main\nblock that calls them with test cases, and assertions that validate results.\nImport jax, jax.numpy, and any needed JAX modules at the top.\n\nExample:\n  import jax\n  import jax.numpy as jnp\n\n  def softmax(x):\n      \"\"\"Implement softmax along the last axis.\"\"\"\n      raise NotImplementedError()\n\n  if __name__ == \"__main__\":\n      x = jnp.array([1.0, 2.0, 3.0])\n      result = softmax(x)\n      assert jnp.allclose(result.sum(), 1.0)\n      print(\"All checks passed!\")\n"
setup_commands = [
    "uv init practical",
    "mkdir practical/examples",
    "sed -i '' \"s/name = \\\"practical\\\"/name = \\\"practical-${TOPIC}-${SUBTOPIC}-${PHASE}\\\"/\" practical/pyproject.toml",
]

[theoretical]
description = "Create a markdown file in the phase's theoretical/ directory named\nYYYY-MM-DD-<slug>.md (e.g. 2026-03-29-pytrees.md).\n\nSelect relevant material from the goal's reference document and compose a\nfocused reading assignment. Summarize key concepts, highlight differences\nfrom PyTorch/NumPy equivalents, and ask the user to explain them back in\ntheir own words. Include code snippets where helpful.\n"
setup_commands = []

[quiz]
description = "Create a markdown file in the phase's quiz/ directory named\nYYYY-MM-DD-<slug>.md (e.g. 2026-03-29-grad-quiz.md).\n\nCompose 3-5 questions based on recent goals and tasks. Mix:\n- Multiple choice (conceptual understanding)\n- Code prediction (what does this output?)\n- Short implementation (write a 3-5 line function)\n\nInclude answer placeholders that the user fills in. Answers section at the\nbottom, initially hidden behind a <details> tag.\n"
setup_commands = []
