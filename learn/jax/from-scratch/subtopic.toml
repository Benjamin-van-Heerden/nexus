name = "From Scratch — JAX to Transformers to DeepSeek"
current_phase = "foundations"

[practical]
description = """
Create exercises as standalone .py files in the practical/examples/ directory,
named by date (YYYY-MM-DD.py). If multiple exercises in one day, use
YYYY-MM-DD_2.py etc.

Each file should be runnable with `uv run python practical/examples/YYYY-MM-DD.py`
from the phase directory. Files should include assertions or test functions that
verify correctness — the user runs the file and sees whether their implementation
passes.

Structure: stub functions with docstrings explaining what to implement, a main
block that calls them with test cases, and assertions that validate results.
Import jax, jax.numpy, and any needed JAX modules at the top.

Example:
  import jax
  import jax.numpy as jnp

  def softmax(x):
      \"\"\"Implement softmax along the last axis.\"\"\"
      raise NotImplementedError()

  if __name__ == "__main__":
      x = jnp.array([1.0, 2.0, 3.0])
      result = softmax(x)
      assert jnp.allclose(result.sum(), 1.0)
      print("All checks passed!")
"""
setup_commands = [
    "uv init practical",
    "mkdir practical/examples",
    "sed -i '' \"s/name = \\\"practical\\\"/name = \\\"practical-${TOPIC}-${SUBTOPIC}-${PHASE}\\\"/\" practical/pyproject.toml",
    "rm practical/README.md"
]

[theoretical]
description = """
Create a markdown file in the phase's theoretical/ directory named
YYYY-MM-DD-<slug>.md (e.g. 2026-03-29-pytrees.md).

Select relevant material from the goal's reference document and compose a
focused reading assignment. Summarize key concepts, highlight differences
from PyTorch/NumPy equivalents, and ask the user to explain them back in
their own words. Include code snippets where helpful.
"""
setup_commands = []

[quiz]
description = """
Create TWO files for each quiz:

1. Quiz file: quiz/YYYY-MM-DD-<slug>.md (e.g. 2026-03-29-grad-quiz.md)
   - Compose 3-5 questions based on recent goals and tasks. Mix:
     - Multiple choice (conceptual understanding)
     - Code prediction (what does this output?)
     - Short implementation (write a 3-5 line function)
   - Include answer placeholders that the user fills in.
   - Do NOT include answers in this file.

2. Answer key: quiz/answers/YYYY-MM-DD-<slug>.md
   - Contains the answers and explanations for the quiz.
   - Kept separate so the user cannot accidentally see them while working.

Register the task with --file pointing to the quiz file (not the answer key).
"""
setup_commands = ["mkdir -p quiz/answers"]

