[practical]
description = """
Worked exercises — 1-2 problems to solidify concepts. Each exercise is a
markdown file in practical/ with:
- Problem statement with context
- Step-by-step solution with reasoning
- Key takeaways

Files: practical/YYYY-MM-DD-<slug>.md
"""
setup_commands = []

[theoretical]
description = """
Reading notes — a markdown document summarizing the material, explaining
concepts in your own words, and posing reflection questions for you to answer.

Files: theoretical/YYYY-MM-DD-<slug>.md
"""
setup_commands = []

[quiz]
description = """
Multiple choice questions — 5-10 questions testing conceptual understanding.
Each question has 4 options (a-d) with one correct answer.

Files: quiz/YYYY-MM-DD-<slug>.md (questions only, NO answers)
Files: quiz/answers/YYYY-MM-DD-<slug>.md (answer key, kept separate)
"""
setup_commands = [
    "mkdir -p quiz/answers",
]
