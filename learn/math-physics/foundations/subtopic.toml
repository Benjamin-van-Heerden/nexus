[quiz]
description = """
Multiple choice questions — 5-10 questions testing conceptual understanding.
Each question has 4 options (a-d) with one correct answer.

Structure:
- Quiz file: quiz/YYYY-MM-DD-<slug>.typ (questions only, NO answers)
- Answer key: quiz/answers/YYYY-MM-DD-<slug>.typ

Include diagrams/charts as needed using Typst.
"""
