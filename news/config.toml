xai_model = "grok-4.3"
synthesis_model = "grok-4.3"
history_days = 3
max_entries_per_source = 30
max_total_entries = 250
max_entry_age_hours = 72
editorial_profile = """
Benjamin wants broad source coverage, but treats some modern left-leaning coverage as prone to anti-Trump, anti-West, and anti-American framing. Do not discard those sources, but actively distinguish reported facts from interpretive framing. Flag loaded language, selective context, activist premises, and emotionally charged anti-Trump or anti-West assumptions when they materially affect a story.
"""
categories = [
  "science",
  "technology",
  "economics",
  "us_politics",
  "international",
  "entertainment",
  "sa_local",
]

