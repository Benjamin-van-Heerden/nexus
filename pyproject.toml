[project]
name = "nexus"
version = "0.1.0"
description = "Personal learning and self-improvement CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.1",
    "tomli-w>=1.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "google-auth-oauthlib>=1.3.1",
    "google-api-python-client>=2.193.0",
    "google-auth-httplib2>=0.3.1",
    "jax>=0.9.2",
    "httpx>=0.28.1",
    "optax>=0.2.8",
    "flax>=0.12.7",
]

[tool.uv.workspace]
members = [
    "learn/jax/from-scratch/foundations/practical",
    "learn/jax/from-scratch/neural-net-primitives/practical",
    "learn/jax/from-scratch/attention-and-transformers/practical",
    "learn/jax/from-scratch/deepseek-moe/practical",
    "learn/jax/from-scratch/flax-rebuild/practical",
]

# Optional: Explicitly point to the uv venv
# python-path = ".venv/bin/python"  # Invalid field for workspace config

# If you want type checking / diagnostics on more files
# diagnostic-mode = "workspace"   # Invalid field - removed
