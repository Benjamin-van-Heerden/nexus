[project]
name = "nexus"
version = "0.1.0"
description = "Personal learning and self-improvement CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.1",
    "tomli-w>=1.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[tool.uv.workspace]
members = [
    "practical",
    "learn/jax/from-scratch/foundations/practical",
    "learn/jax/from-scratch/neural-net-primitives/practical",
    "learn/jax/from-scratch/attention-and-transformers/practical",
]
